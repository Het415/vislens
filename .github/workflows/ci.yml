# ── vislens CI ────────────────────────────────────────────────────────────────
# One job, and it needs no secrets, no network and no GPU. That is a property
# of the design rather than a happy accident, and it is worth stating because
# the sibling project's benchmark is the opposite: its judged eval costs Groq
# tokens, is bounded to roughly one run a day, and carries a ~37% run-to-run
# noise floor, so it cannot live in CI at all.
#
# Everything here is deterministic:
#   - the compliance checks are arithmetic over pixels
#   - the near-duplicate hashes are fixed functions of the bytes
#   - the request-forgery tests reject before connecting, and the one case that
#     needs a hostile DNS answer patches the resolver seam
#   - the catalog build runs against a miniature ABO fixture the test writes,
#     because the real archives are 83 MB and 3 GB and CI has neither
#
# So this suite is safe to run on every push and it means something when it
# passes. ~200 tests in under 30 seconds.
#
# Deliberately NOT here:
#   - the near-duplicate calibration (needs real downloaded product images; its
#     output is a committed dated report, and a test asserts the shipped
#     threshold matches it)
#   - any training (needs a GPU; see CLAUDE.md on Kaggle)
#   - a Docker build (there is no deployment — this is a benchmark repo plus a
#     small service, and a p99 without a workload would be a number we invented)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — no reason to pay for a run whose
# commit has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.11 matches Kaggle's GPU runtime, which is what the training half
          # has to import cleanly under. Not the sibling project's 3.13.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # --prefer-binary matters: scipy, duckdb and pandas all have sdists
          # that take many minutes to compile and wheels that take seconds. The
          # sibling project learned this on its own Docker builds.
          #
          # `data` is not optional for the suite even though it is optional for
          # serving: test_catalog_build.py and test_pack_shards.py import
          # duckdb. `bench` is deliberately absent — nothing imports
          # onnxruntime or faiss yet, so installing them here would only hide
          # the day something starts to.
          pip install --prefer-binary -e ".[dev,data]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Pytest
        run: pytest -q

      - name: Confirm torch never reached a serving path
        # The load-bearing constraint of this whole repo: torch belongs to the
        # `train` extra only. If it turns up in a default install, the ONNX
        # serving path has silently regained ~490 MiB of import overhead and
        # the reason the sibling project OOM-killed at 512 MB is back.
        #
        # This job installs `.[dev,data]`, so it can only speak for torch and
        # the `bench` extra. The full serving set is asserted by the `serving`
        # job below, which installs no extras at all.
        run: |
          for pkg in torch onnxruntime faiss-cpu; do
            if pip show "$pkg" > /dev/null 2>&1; then
              echo "::error::$pkg is installed by the default dependency set."
              echo "torch belongs to [train] and onnxruntime/faiss-cpu to [bench] — see CLAUDE.md section 2."
              exit 1
            fi
          done
          echo "torch, onnxruntime and faiss absent from the test install, as intended"

      - name: Confirm no data or weights are tracked
        # The no-committed-data rule, enforced rather than trusted. Download
        # scripts rebuild everything; a 3 GB archive in git history is not
        # something you undo.
        run: |
          offenders=$(git ls-files | grep -E '\.(tar|parquet|onnx|pt|pth|npy)$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::data or model artifacts are tracked:"
            echo "$offenders"
            exit 1
          fi
          echo "no archives, parquet or weights tracked"

  serving:
    name: Serving install stays small
    runs-on: ubuntu-latest

    # The dependency split is only real if something checks it. This job
    # installs the default set — no extras — and asserts both directions:
    # nothing heavy sneaks back into `[project].dependencies`, and the small set
    # left behind is genuinely enough to import the service.
    #
    # Worth a second job rather than a step in the first: the test job needs
    # `.[dev,data]`, so it physically cannot tell whether duckdb and pandas are
    # in the serving set or merely in its own. Only a clean install can. It
    # costs ~20s, no secrets and no network beyond PyPI.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the default set only
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary .

      - name: Confirm no build-or-bench dependency is in the serving set
        # These five cost 308 MB of the 426 MB the default set used to install,
        # against a 512 MB Render free instance, and the request path reaches
        # none of them. onnxruntime is expected back here the day the semantic
        # checks ship; until then its absence is the invariant. pyarrow is in
        # this list while being declared by no extra at all — it is imported
        # nowhere, so anything that reinstates it should have to say why.
        run: |
          failed=0
          for pkg in torch onnxruntime faiss-cpu duckdb pyarrow pandas; do
            if pip show "$pkg" > /dev/null 2>&1; then
              echo "::error::$pkg reached the default (serving) dependency set."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Move it to [data], [bench] or [train] — or, for pyarrow, justify it first."
            echo "See the comments in pyproject.toml."
            exit 1
          fi
          echo "serving install carries none of torch/onnxruntime/faiss/duckdb/pyarrow/pandas"

      - name: Confirm the serving set is sufficient, and loads nothing heavy
        # The measurement the split was derived from, kept as a regression
        # test: importing the app pulls PIL, numpy and scipy and stops there.
        # If a future import of pandas lands in a module the service reaches,
        # this fails here instead of at 512 MB on a live instance.
        run: |
          python - <<'PY'
          import sys

          import vislens.service.app  # noqa: F401  (imported for its side effects)

          heavy = ["torch", "onnxruntime", "faiss", "duckdb", "pyarrow", "pandas"]
          leaked = [name for name in heavy if name in sys.modules]
          if leaked:
              sys.exit(f"::error::vislens.service.app imported {', '.join(leaked)}")

          for name in ["PIL", "numpy", "scipy"]:
              assert name in sys.modules, f"{name} unexpectedly absent"

          print("service imports cleanly on the serving set: PIL, numpy, scipy only")
          PY

      - name: Confirm the rule thresholds ship in the wheel
        # The regression test for a bug that was invisible at build time. The
        # thresholds used to live at the repo root under `data/` and be resolved
        # with `Path(__file__).resolve().parents[3]`, so a non-editable install
        # imported the service cleanly and raised FileNotFoundError on the first
        # request. They now ship as package data and are read through
        # `importlib.resources`.
        #
        # This runs from a different directory ON PURPOSE. Run from the repo
        # root, a lookup that had quietly fallen back to the checkout would
        # still succeed and this step would prove nothing.
        run: |
          cd "$(mktemp -d)"
          python - <<'PY'
          import sys
          from importlib import resources

          from vislens.rules.image_dedup import load_thresholds
          from vislens.rules.image_rules import load_rules

          rules, thresholds = load_rules(), load_thresholds()
          assert rules.get("checks"), "rules_v1.json loaded but carries no checks"
          assert thresholds.get("calibrated") is True, "thresholds_v1.json is not calibrated"

          where = resources.files("vislens.rules")
          if "site-packages" not in str(where):
              sys.exit(f"::error::resolved from {where}, not from the installed package")

          print(f"both rule files resolved from the installed package at {where}")
          PY

  training:
    name: Training code (CPU)
    runs-on: ubuntu-latest

    # A THIRD job, and it has to be separate from `test`. The training code
    # imports torch, and the `test` job asserts torch is ABSENT from a serving
    # install — the two cannot share an environment without one of them
    # becoming a lie. So `test` stays torch-free and skips these tests via
    # `pytest.importorskip`, and this job installs `[train]` and runs them.
    #
    # The CPU wheel index is not an optimisation: the default Linux torch wheel
    # carries CUDA and is ~2.5 GB, for a job with no GPU.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with the train extra
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --prefer-binary -e ".[dev,data,train]"

      - name: Confirm torch is actually importable
        # Without this the suite could SKIP rather than run — `importorskip`
        # turns a broken install into a green tick, which is the one failure
        # mode a guarded test file introduces.
        run: python -c "import torch, webdataset; print(torch.__version__)"

      - name: Pytest (training)
        run: pytest tests/test_training.py -q
